name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  cpu-contracts-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight document & schema packages for contract checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install python-docx openpyxl python-pptx pypdf pyyaml pillow reportlab

      - name: Verify CPU environment & all 4 profile contracts
        run: python scripts/verify_env.py --mode cpu

      - name: Verify 4-role workspace demos & isolation boundaries
        run: python scripts/build_workspace_demos.py --verify

      - name: Run release regression & hygiene test suite
        run: python -m unittest discover -s tests -v
